<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Italia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: griglia di "tasti" canale come un telecomando, lettore a tutto schermo sopra */
:root{
  --bg:#0d1014; --panel:#171b22; --panel-hi:#202631; --line:#2a313d;
  --fg:#eef1f5; --muted:#8b95a5; --accent:#2f8cff; --live:#ff3b3b; --star:#ffc531;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px))}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:2.1rem;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
h1 .dot{width:12px;height:12px;border-radius:50%;background:var(--live);box-shadow:0 0 12px var(--live)}
.tools{display:flex;gap:10px;align-items:center}
.btn{font:600 1rem var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
.btn:focus-visible,.ch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);border-color:var(--accent)}
#status{color:var(--muted);font-size:.95rem;padding:0 max(20px,env(safe-area-inset-left,0px));min-height:1.4em}
main{padding:10px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px))}
.section-label{font-family:var(--display);font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ch{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 10px 10px;min-height:150px;cursor:pointer;color:var(--fg);font:inherit;text-align:center}
.ch:active{background:var(--panel-hi)}
.ch .num{position:absolute;top:8px;left:10px;font-family:var(--display);font-size:1.1rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ch .logo{width:100%;height:78px;display:flex;align-items:center;justify-content:center}
.ch .logo img{max-width:80%;max-height:70px;object-fit:contain}
.ch .logo span{font-family:var(--display);font-size:1.8rem;font-weight:700}
.ch .name{font-weight:600;font-size:1rem;line-height:1.2}
.ch .fav{position:absolute;top:4px;right:4px;width:40px;height:40px;border:0;background:none;color:var(--line);font-size:1.5rem;cursor:pointer;border-radius:8px}
.ch .fav.on{color:var(--star)}
.ch.bad{opacity:.45}
/* Lettore */
#player{position:fixed;inset:0;background:#000;z-index:20;display:flex;align-items:center;justify-content:center}
#player video{width:100%;height:100%;object-fit:contain;background:#000}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:16px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .3s}
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(0,0,0,.85),transparent);transition:opacity .3s}
#top .now{font-family:var(--display);font-size:2rem;font-weight:700}
#top .badge{background:var(--live);color:#fff;font:700 .8rem var(--body);letter-spacing:.1em;padding:3px 8px;border-radius:5px}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:80%;text-align:center;font-size:1.2rem;color:#fff;background:rgba(0,0,0,.6);padding:16px 22px;border-radius:12px}
.hide{opacity:0;pointer-events:none}
.spacer{flex:1}
.pbtn{font:600 1.1rem var(--body);color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:12px;padding:14px 20px;cursor:pointer;min-width:64px}
.pbtn:focus-visible{outline:3px solid var(--accent)}
footer{color:var(--muted);font-size:.85rem;text-align:center;padding:10px 0 24px}
@media (prefers-reduced-motion:reduce){#bar,#top{transition:none}}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>TV Italia</h1>
  <div class="tools">
    <button class="btn" id="onlyFav" type="button">★ Preferiti</button>
    <button class="btn" id="reload" type="button">Aggiorna lista</button>
  </div>
</header>
<div id="status">Carico i canali…</div>
<main>
  <div id="favWrap" hidden>
    <div class="section-label">Preferiti</div>
    <div class="grid" id="favGrid"></div>
  </div>
  <div id="allWrap">
    <div class="section-label">Canali nazionali</div>
    <div class="grid" id="grid"></div>
    <div class="section-label">Altri canali</div>
    <button class="btn" id="showOther" type="button">Mostra canali locali e altri</button>
    <div class="grid" id="otherGrid" hidden></div>
  </div>
</main>
<footer>Versione <span id="ver"></span> · lista canali: Free-TV/IPTV su GitHub</footer>

<div id="player" hidden>
  <video id="video" playsinline autoplay></video>
  <div id="top"><span class="badge">LIVE</span><span class="now" id="nowName"></span></div>
  <div id="msg" hidden></div>
  <div id="bar">
    <button class="pbtn" id="pClose" type="button">✕ Canali</button>
    <div class="spacer"></div>
    <button class="pbtn" id="pPrev" type="button">◀ Prec.</button>
    <button class="pbtn" id="pNext" type="button">Succ. ▶</button>
    <button class="pbtn" id="pFull" type="button">⛶ Schermo intero</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
const VERSION = "1.1";
const LIST_URL = "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_italy.m3u8";
document.getElementById("ver").textContent = VERSION;

const $ = id => document.getElementById(id);
let channels = [];     // [{key,name,num,logo,urls:[]}]
let current = -1, urlIdx = 0, hls = null, hideTimer = null, onlyFav = false;

function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
let favs = new Set(store("favs") || []);
let lastOk = store("lastOk") || {};   // canale -> link che ha funzionato l'ultima volta

// Legge il file .m3u8 e raggruppa i link dello stesso canale
function parse(text){
  const lines = text.split(/\r?\n/);
  const map = new Map();
  let national = true; // nella lista i canali nazionali vengono per primi, numerati
  let order = 0;
  for(let i=0;i<lines.length;i++){
    const l = lines[i].trim();
    if(!l.startsWith("#EXTINF")) continue;
    if(!/tvg-chno=/.test(l)) national = false;
    let url = "";
    for(let j=i+1;j<lines.length;j++){ const u=lines[j].trim(); if(!u) continue; if(u.startsWith("#")) { if(u.startsWith("#EXTINF")) break; continue; } url=u; break; }
    if(!url) continue;
    const attr = n => { const m = l.match(new RegExp(n+'="([^"]*)"')); return m?m[1]:""; };
    const name = (attr("tvg-name") || l.split(",").pop()).replace(/[ⒼⓈⓎ]/g,"").trim();
    const key = name.toLowerCase();
    if(!map.has(key)) map.set(key,{key,name,num:national?(parseInt(attr("tvg-chno"))||999):999,logo:attr("tvg-logo"),national,order:order++,urls:[]});
    const ch = map.get(key);
    // i link "relinker" Rai sono di riserva: in fondo
    if(/relinker/i.test(url)) ch.urls.push(url); else ch.urls.unshift(url);
  }
  const list = [...map.values()].sort((a,b)=> (b.national-a.national) || (a.national ? a.num-b.num : a.name.localeCompare(b.name)) || a.order-b.order);
  list.forEach(c=>{ const ok=lastOk[c.key]; if(ok && c.urls.includes(ok)){ c.urls=[ok,...c.urls.filter(u=>u!==ok)]; } });
  return list;
}

function tile(ch, idx){
  const b = document.createElement("div");
  b.className = "ch"; b.tabIndex = 0; b.setAttribute("role","button");
  b.innerHTML = `<span class="num">${ch.num<999?ch.num:""}</span>
    <button class="fav ${favs.has(ch.key)?"on":""}" type="button" aria-label="Preferito">★</button>
    <div class="logo">${ch.logo?`<img alt="" loading="lazy" referrerpolicy="no-referrer" src="${ch.logo}">`:`<span>${ch.name.slice(0,3)}</span>`}</div>
    <div class="name">${ch.name}</div>`;
  const img = b.querySelector("img");
  if(img) img.onerror = () => { img.parentNode.innerHTML = `<span>${ch.name.slice(0,3)}</span>`; };
  b.addEventListener("click", e=>{ if(e.target.closest(".fav")) return; play(idx); });
  b.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); play(idx); } });
  b.querySelector(".fav").addEventListener("click", e=>{
    e.stopPropagation();
    favs.has(ch.key)?favs.delete(ch.key):favs.add(ch.key);
    store("favs",[...favs]); render();
  });
  return b;
}

function render(){
  const g=$("grid"), og=$("otherGrid"), fg=$("favGrid"); g.innerHTML=""; og.innerHTML=""; fg.innerHTML="";
  const showOther=!og.hidden;
  channels.forEach((c,i)=>{
    if(favs.has(c.key)) fg.appendChild(tile(c,i));
    if(c.national) g.appendChild(tile(c,i));
    else if(showOther) og.appendChild(tile(c,i));
  });
  $("showOther").textContent = showOther ? "Nascondi canali locali e altri" : "Mostra canali locali e altri ("+channels.filter(c=>!c.national).length+")";
  $("favWrap").hidden = favs.size===0;
  $("allWrap").hidden = onlyFav && favs.size>0;
  $("onlyFav").classList.toggle("on", onlyFav);
}

async function load(){
  $("status").textContent="Carico i canali…";
  try{
    const r = await fetch(LIST_URL+"?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const txt = await r.text();
    store("listCache", txt);
    channels = parse(txt);
    $("status").textContent = channels.filter(c=>c.national).length+" canali nazionali. Tocca la stella per aggiungere un preferito.";
  }catch(e){
    const cached = store("listCache");
    if(cached){ channels=parse(cached); $("status").textContent="Lista non aggiornata (sei offline?). Uso l'ultima salvata."; }
    else { $("status").textContent="Non riesco a scaricare la lista dei canali. Controlla la connessione e tocca Aggiorna lista."; }
  }
  render();
}

/* ---------- Lettore ---------- */
const video = $("video");
function showMsg(t){ $("msg").textContent=t; $("msg").hidden=!t; }
function poke(){
  $("bar").classList.remove("hide"); $("top").classList.remove("hide");
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{ $("bar").classList.add("hide"); $("top").classList.add("hide"); },4000);
}
function stop(){ if(hls){ hls.destroy(); hls=null; } video.removeAttribute("src"); video.load(); }

function play(idx){
  if(idx<0) idx=channels.length-1;
  if(idx>=channels.length) idx=0;
  current=idx; urlIdx=0;
  $("player").hidden=false; $("nowName").textContent=channels[idx].name;
  store("lastCh", channels[idx].key);
  poke(); tryUrl();
}

function tryUrl(){
  const ch=channels[current];
  stop();
  if(urlIdx>=ch.urls.length){ showMsg(ch.name+" al momento non funziona. Prova un altro canale."); return; }
  const url=ch.urls[urlIdx];
  showMsg("Sintonizzo "+ch.name+"…");
  let started=false;
  const ok=()=>{ if(started) return; started=true; showMsg(""); lastOk[ch.key]=url; store("lastOk",lastOk); };
  const fail=()=>{ if(started) return; urlIdx++; tryUrl(); };
  const guard=setTimeout(fail,15000);
  video.onplaying=()=>{ clearTimeout(guard); ok(); };
  if(window.Hls && Hls.isSupported()){
    hls=new Hls({lowLatencyMode:false, manifestLoadingMaxRetry:2, levelLoadingMaxRetry:2});
    hls.on(Hls.Events.ERROR,(_,d)=>{ if(d.fatal){ clearTimeout(guard); fail(); } });
    hls.loadSource(url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{ video.play().catch(()=>{ video.muted=true; video.play().catch(()=>{}); showMsg("Tocca lo schermo per attivare l'audio"); }); });
  }else{
    video.src=url; video.onerror=()=>{ clearTimeout(guard); fail(); };
    video.play().catch(()=>{});
  }
}

function closePlayer(){ stop(); $("player").hidden=true; showMsg(""); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }

$("pClose").onclick=closePlayer;
$("pPrev").onclick=()=>play(current-1);
$("pNext").onclick=()=>play(current+1);
$("pFull").onclick=()=>{ const p=$("player"); (document.fullscreenElement?document.exitFullscreen():(p.requestFullscreen||p.webkitRequestFullscreen||function(){return Promise.reject()}).call(p))?.catch?.(()=>{}); };
$("player").addEventListener("click",e=>{ if(video.muted){ video.muted=false; showMsg(""); } if(e.target===video||e.target===$("player")) poke(); });
$("reload").onclick=load;
$("showOther").onclick=()=>{ $("otherGrid").hidden=!$("otherGrid").hidden; render(); };
$("onlyFav").onclick=()=>{ onlyFav=!onlyFav; render(); };

// Telecomando / tastiera
document.addEventListener("keydown",e=>{
  if($("player").hidden) return;
  poke();
  if(e.key==="ChannelUp"||e.key==="PageUp"||e.key==="ArrowUp"){ e.preventDefault(); play(current-1); }
  else if(e.key==="ChannelDown"||e.key==="PageDown"||e.key==="ArrowDown"){ e.preventDefault(); play(current+1); }
  else if(e.key==="Escape"||e.key==="Backspace"||e.key==="GoBack"||e.key==="BrowserBack"){ e.preventDefault(); history.back(); }
});
// tasto Indietro: chiude il lettore invece di uscire dalla pagina
history.replaceState({v:"grid"},"");
const _play=play; play=function(i){ if($("player").hidden) history.pushState({v:"player"},""); _play(i); };
window.addEventListener("popstate",()=>{ if(!$("player").hidden) closePlayer(); });
$("pClose").onclick=()=>history.back();

try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
load();
</script>
</body>
</html>
