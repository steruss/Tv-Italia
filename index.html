<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>TV Italia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: video in un riquadro + elenco canali (accanto su schermo largo, sotto su telefono) */
:root{
  --bg:#0d1014; --panel:#171b22; --panel-hi:#222a36; --line:#2a313d;
  --fg:#eef1f5; --muted:#8b95a5; --accent:#2f8cff; --live:#ff3b3b; --star:#ffc531; --ok:#2ecc71;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{display:flex;flex-direction:column;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.8rem;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
h1 .dot{width:11px;height:11px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live)}
.ver{font:700 .95rem var(--body);color:#fff;background:var(--accent);padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}

.layout{display:grid;grid-template-columns:1fr;gap:14px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:900px){
  body{height:100dvh;overflow:hidden}
  .layout{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) minmax(380px,32%);padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
  .side{overflow-y:auto;min-height:0;padding-right:4px}
  .stage{min-height:0}
  .screen{flex:1;min-height:0;aspect-ratio:auto}
  .controls .btn{padding:12px 20px;font-size:1.1rem}
  .now{font-size:1.6rem}
  .side .ch{min-height:76px;gap:14px;padding:10px 8px 10px 12px}
  .side .ch .num{width:38px;font-size:1.5rem}
  .side .ch .logo{width:84px;height:54px}
  .side .ch .logo img{max-width:76px;max-height:46px}
  .side .ch .name .t{font-size:1.3rem}
  .side .ch .name .prog{font-size:1rem}
  .epg{font-size:1.1rem}
  .side .ch .fav{width:52px;height:52px;font-size:1.7rem}
  .side-tools .btn{font-size:1.05rem;padding:12px 16px}
}

/* Riquadro video */
.stage{min-width:0;display:flex;flex-direction:column;gap:10px}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
@media (max-width:899px){ .stage{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:6px} }
.screen video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;color:#fff;pointer-events:none}
.overlay .big{font-family:var(--display);font-size:1.6rem;font-weight:700}
.overlay .small{color:#c6ccd6;font-size:.95rem;max-width:90%}
.overlay.dim{background:rgba(0,0,0,.55)}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.now{font-family:var(--display);font-size:1.4rem;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.badge{background:var(--live);color:#fff;font:700 .72rem var(--body);letter-spacing:.1em;padding:3px 7px;border-radius:5px}
.btn{font:600 .98rem var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn:active{background:var(--panel-hi)}
.btn:focus-visible,.ch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);border-color:var(--accent)}
#status{color:var(--muted);font-size:.9rem;min-height:1.3em}
#status.err{color:#ff8a8a}

/* Elenco canali */
.side{min-width:0;display:flex;flex-direction:column;gap:8px}
.side-tools{display:flex;gap:8px;flex-wrap:wrap}
.section-label{font-family:var(--display);font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.list{display:flex;flex-direction:column;gap:6px}
.ch{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px 8px 10px;cursor:pointer;min-height:58px}
.ch:active{background:var(--panel-hi)}
.ch.playing{border-color:var(--accent);background:var(--panel-hi)}
.ch .num{width:30px;text-align:right;font-family:var(--display);font-size:1.15rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.ch .logo{width:64px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff1;border-radius:6px}
.ch .logo img{max-width:58px;max-height:34px;object-fit:contain}
.ch .logo span{font-family:var(--display);font-weight:700;font-size:1rem}
.ch .name{flex:1;min-width:0;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.ch .fav{width:44px;height:44px;flex:none;border:0;background:none;color:#3a4250;font-size:1.4rem;cursor:pointer;border-radius:8px}
.ch .fav.on{color:var(--star)}
footer{color:var(--muted);font-size:.8rem;padding:10px 0}
.hdr-right{display:flex;align-items:center;gap:10px}
.tvmode{font:700 1rem var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
.tvmode.on{background:var(--accent);border-color:var(--accent);color:#fff}
.epg{display:flex;flex-direction:column;gap:2px;font-size:.98rem;min-height:1.3em}
.epg .nowp{font-weight:600}
.epg .nowp b{color:var(--accent)}
.epg .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;max-width:420px}
.epg .bar i{display:block;height:100%;background:var(--accent)}
.epg .next{color:var(--muted)}
.ch .name .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .name .prog{font-weight:400;font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.note{color:var(--muted);font-size:.9rem}
.fsnav{position:absolute;top:50%;transform:translateY(-50%);width:84px;height:120px;border:0;border-radius:16px;
  background:rgba(0,0,0,.45);color:#fff;font-size:3.4rem;line-height:1;cursor:pointer;display:none;z-index:3;transition:opacity .3s}
.fsnav.prev{left:max(20px,env(safe-area-inset-left,0px))}
.fsnav.next{right:max(20px,env(safe-area-inset-right,0px))}
.fsnav:active{background:rgba(47,140,255,.7)}
.screen.full .fsnav{display:block}
.screen.full.idle .fsnav{opacity:0}
.screen.full{border-radius:0;border:0}
.toast{position:absolute;left:50%;top:max(24px,env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:80%;
  background:rgba(0,0,0,.72);color:#fff;border-radius:14px;padding:10px 22px;text-align:center;z-index:4;pointer-events:none;transition:opacity .3s}
.toast .tn{font-family:var(--display);font-size:2rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px}
.toast .tn .n{color:var(--accent)}
.toast .tp{font-size:1.05rem;color:#d4d9e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.off{opacity:0}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>TV Italia</h1>
  <div class="hdr-right"><button class="tvmode" id="tvMode" type="button">📺 Modalità TV</button><span class="ver" id="ver"></span></div>
</header>

<div class="layout">
  <section class="stage">
    <div class="screen" id="screen">
      <video id="video" playsinline></video>
      <button class="fsnav prev" id="fsPrev" type="button" aria-label="Canale precedente">‹</button>
      <button class="fsnav next" id="fsNext" type="button" aria-label="Canale successivo">›</button>
      <div class="toast off" id="toast"><div class="tn"><span class="n" id="toastNum"></span><span id="toastName"></span></div><div class="tp" id="toastProg"></div></div>
      <div class="overlay dim" id="overlay">
        <div class="big" id="ovBig">Scegli un canale</div>
        <div class="small" id="ovSmall">Tocca un canale dall'elenco per guardarlo qui.</div>
      </div>
    </div>
    <div class="controls">
      <div class="now"><span class="badge" id="liveBadge" hidden>LIVE</span><span id="nowName">Nessun canale</span></div>
      <button class="btn" id="pPrev" type="button" aria-label="Canale precedente">◀</button>
      <button class="btn" id="pNext" type="button" aria-label="Canale successivo">▶</button>
      <button class="btn" id="pFull" type="button">⛶ Intero</button>
    </div>
    <div class="epg" id="epg"></div>
    <div id="status">Carico i canali…</div>
  </section>

  <aside class="side">
    <div class="side-tools">
      <button class="btn" id="onlyFav" type="button">★ Solo preferiti</button>
      <button class="btn" id="reload" type="button">Aggiorna lista</button>
    </div>
    <div id="favWrap" hidden>
      <div class="section-label">Preferiti</div>
      <div class="list" id="favList"></div>
    </div>
    <div id="allWrap">
      <div class="section-label">Canali nazionali</div>
      <div class="list" id="list"></div>
      <div class="section-label">Altri canali</div>
      <button class="btn" id="showOther" type="button">Mostra canali locali e altri</button>
      <div class="list" id="otherList" hidden></div>
      <div class="section-label">Non disponibili</div>
      <div class="note" id="badNote">Controllo quali canali funzionano…</div>
      <button class="btn" id="showBad" type="button" hidden>Mostra canali non disponibili</button>
      <div class="list" id="badList" hidden></div>
    </div>
    <footer>Lista canali: Free-TV/IPTV su GitHub</footer>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
const VERSION = "1.5";
const LIST_URL = "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_italy.m3u8";
const $ = id => document.getElementById(id);
$("ver").textContent = "Versione " + VERSION;

let channels = [];
let current = -1, urlIdx = 0, hls = null, attempt = 0, onlyFav = false;

function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
let favs = new Set(store("favs") || []);
let lastOk = store("lastOk") || {};
// canali che non rispondono: {chiave: orario del controllo}. Si ricontrollano dopo 3 ore.
let bad = store("bad") || {};
const BAD_TTL = 3*3600*1000;
function isBad(c){ return bad[c.key] && Date.now()-bad[c.key] < BAD_TTL; }
let epg = {};

function status(t, err){ const s=$("status"); s.textContent=t; s.classList.toggle("err", !!err); }
function overlay(big, small){
  const o=$("overlay");
  if(!big){ o.hidden=true; return; }
  o.hidden=false; $("ovBig").textContent=big; $("ovSmall").textContent=small||"";
}

// Legge il file .m3u8 e raggruppa i link dello stesso canale
function parse(text){
  const lines = text.split(/\r?\n/);
  const map = new Map();
  let national = true, order = 0;
  for(let i=0;i<lines.length;i++){
    const l = lines[i].trim();
    if(!l.startsWith("#EXTINF")) continue;
    if(!/tvg-chno=/.test(l)) national = false;
    let url = "";
    for(let j=i+1;j<lines.length;j++){ const u=lines[j].trim(); if(!u) continue; if(u.startsWith("#")){ if(u.startsWith("#EXTINF")) break; continue; } url=u; break; }
    if(!url) continue;
    const attr = n => { const m = l.match(new RegExp(n+'="([^"]*)"')); return m?m[1]:""; };
    const name = (attr("tvg-name") || l.split(",").pop()).replace(/[ⒼⓈⓎ]/g,"").trim();
    const key = name.toLowerCase();
    if(!map.has(key)) map.set(key,{key,name,num:national?(parseInt(attr("tvg-chno"))||999):999,logo:attr("tvg-logo"),national,order:order++,urls:[]});
    const ch = map.get(key);
    if(/relinker/i.test(url)) ch.urls.push(url); else ch.urls.unshift(url);
  }
  const list = [...map.values()].sort((a,b)=> (b.national-a.national) || (a.national ? a.num-b.num : a.name.localeCompare(b.name)) || a.order-b.order);
  list.forEach(c=>{ const ok=lastOk[c.key]; if(ok && c.urls.includes(ok)) c.urls=[ok,...c.urls.filter(u=>u!==ok)]; });
  return list;
}

function esc(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function row(ch, idx){
  const b = document.createElement("div");
  b.className = "ch" + (idx===current?" playing":""); b.dataset.idx=idx; b.tabIndex = 0; b.setAttribute("role","button");
  b.innerHTML = `<span class="num">${ch.num<999?ch.num:""}</span>
    <div class="logo">${ch.logo?`<img alt="" loading="lazy" referrerpolicy="no-referrer" src="${esc(ch.logo)}">`:`<span>${esc(ch.name.slice(0,3))}</span>`}</div>
    <div class="name"><div class="t">${esc(ch.name)}</div><div class="prog">${esc(nowProg(ch)?nowProg(ch)[2]:"")}</div></div>
    <button class="fav ${favs.has(ch.key)?"on":""}" type="button" aria-label="Preferito">★</button>`;
  const img = b.querySelector("img");
  if(img) img.onerror = () => { img.parentNode.innerHTML = `<span>${esc(ch.name.slice(0,3))}</span>`; };
  b.addEventListener("click", e=>{ if(e.target.closest(".fav")) return; play(idx); });
  b.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); play(idx); } });
  b.querySelector(".fav").addEventListener("click", e=>{
    e.stopPropagation();
    favs.has(ch.key)?favs.delete(ch.key):favs.add(ch.key);
    store("favs",[...favs]); render();
  });
  return b;
}

function render(){
  const l=$("list"), ol=$("otherList"), fl=$("favList"), bl=$("badList");
  l.innerHTML=""; ol.innerHTML=""; fl.innerHTML=""; bl.innerHTML="";
  const showOther=!ol.hidden, showBad=!bl.hidden;
  let nBad=0;
  channels.forEach((c,i)=>{
    if(c.national && isBad(c) && i!==current){ nBad++; if(showBad) bl.appendChild(row(c,i)); return; }
    if(favs.has(c.key)) fl.appendChild(row(c,i));
    if(c.national) l.appendChild(row(c,i));
    else if(showOther) ol.appendChild(row(c,i));
  });
  $("showBad").hidden = nBad===0;
  $("showBad").textContent = showBad ? "Nascondi canali non disponibili" : "Mostra canali non disponibili ("+nBad+")";
  if(checking) $("badNote").textContent="Controllo quali canali funzionano…";
  else $("badNote").textContent = nBad ? nBad+" canali non rispondono e sono nascosti. Si ricontrollano da soli." : "Tutti i canali nazionali rispondono.";
  $("showOther").textContent = showOther ? "Nascondi canali locali e altri" : "Mostra canali locali e altri ("+channels.filter(c=>!c.national).length+")";
  $("favWrap").hidden = favs.size===0;
  $("allWrap").hidden = onlyFav && favs.size>0;
  $("onlyFav").classList.toggle("on", onlyFav);
}

async function load(){
  status("Carico i canali…");
  try{
    const r = await fetch(LIST_URL+"?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("errore "+r.status);
    const txt = await r.text();
    store("listCache", txt);
    channels = parse(txt);
    status(channels.filter(c=>c.national).length+" canali nazionali pronti.");
    firstLoad();
  }catch(e){
    const cached = store("listCache");
    if(cached){ channels=parse(cached); status("Lista non aggiornata, uso l'ultima salvata.", true); }
    else status("Non riesco a scaricare la lista dei canali ("+e.message+"). Tocca Aggiorna lista.", true);
  }
  render();
}

/* ---------- Avvio: ultimo canale, guida TV, controllo canali ---------- */
let started0=false;
function firstLoad(){
  if(started0) return; started0=true;
  loadEpg(); setInterval(loadEpg, 30*60*1000); setInterval(()=>{ showEpg(); refreshProgs(); }, 60*1000);
  checkAll();
  const last=store("lastCh");
  const i=channels.findIndex(c=>c.key===last);
  if(i>=0) play(i);
}

async function loadEpg(){
  try{
    const r=await fetch("epg.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    epg=(await r.json()).channels||{};
    showEpg(); refreshProgs();
  }catch(e){}
}
function progsOf(ch){ return ch ? (epg[ch.name]||[]) : []; }
function nowProg(ch){ const t=Date.now()/1000; return progsOf(ch).find(p=>p[0]<=t && p[1]>t); }
function hhmm(ts){ const d=new Date(ts*1000); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function showEpg(){
  const box=$("epg"), ch=channels[current];
  if(!ch){ box.innerHTML=""; return; }
  const t=Date.now()/1000, list=progsOf(ch);
  const i=list.findIndex(p=>p[0]<=t && p[1]>t);
  if(i<0){ box.innerHTML='<span class="next">Guida TV non disponibile per questo canale</span>'; return; }
  const p=list[i], n=list[i+1], pct=Math.min(100,Math.max(0,(t-p[0])/(p[1]-p[0])*100));
  box.innerHTML=`<div class="nowp"><b>Ora</b> ${esc(p[2])} <span class="next">fino alle ${hhmm(p[1])}</span></div>
    <div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div>
    ${n?`<div class="next">Dopo, alle ${hhmm(n[0])}: ${esc(n[2])}</div>`:""}`;
}
function refreshProgs(){
  document.querySelectorAll(".ch").forEach(el=>{
    const i=+el.dataset.idx, p=nowProg(channels[i]), pe=el.querySelector(".prog");
    if(pe) pe.textContent=p?p[2]:"";
  });
}

// Controlla in sottofondo quali canali nazionali rispondono (4 alla volta)
let checking=false;
async function probe(url){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),8000);
  try{ const r=await fetch(url,{signal:ctl.signal,cache:"no-store"}); if(!r.ok) return false; const tx=await r.text(); return tx.includes("#EXTM3U"); }
  catch(e){ return false; } finally{ clearTimeout(t); }
}
async function checkAll(){
  checking=true; render();
  const todo=channels.filter(c=>c.national && !(bad[c.key] && Date.now()-bad[c.key]<BAD_TTL));
  let k=0;
  async function worker(){
    while(k<todo.length){
      const c=todo[k++]; let ok=false;
      for(const u of c.urls){ if(await probe(u)){ ok=true; break; } }
      if(ok) delete bad[c.key]; else bad[c.key]=Date.now();
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  store("bad",bad); checking=false; render();
}

/* ---------- Lettore nel riquadro ---------- */
const video = $("video");
function stop(){ if(hls){ hls.destroy(); hls=null; } video.onplaying=null; video.onerror=null; video.removeAttribute("src"); video.load(); }

function play(idx){
  if(!channels.length) return;
  if(idx<0) idx=channels.length-1;
  if(idx>=channels.length) idx=0;
  current=idx; urlIdx=0;
  $("nowName").textContent=channels[idx].name; $("liveBadge").hidden=true;
  store("lastCh", channels[idx].key); showEpg(); toast(channels[idx]);
  render();
  tryUrl();
}

function tryUrl(){
  const ch=channels[current];
  const my=++attempt;               // ignora eventi di tentativi vecchi
  stop();
  if(urlIdx>=ch.urls.length){
    overlay(ch.name+" non disponibile","Nessun link funziona in questo momento. Prova un altro canale.");
    status(ch.name+": tutti i link ("+ch.urls.length+") hanno dato errore.", true);
    if(ch.national){ bad[ch.key]=Date.now(); store("bad",bad); }
    return;
  }
  const url=ch.urls[urlIdx];
  overlay("Sintonizzo "+ch.name+"…", ch.urls.length>1 ? "Link "+(urlIdx+1)+" di "+ch.urls.length : "");
  status("Collegamento a "+ch.name+"…");
  let started=false;
  const fail=(why)=>{
    if(started || my!==attempt) return;
    status(ch.name+": link "+(urlIdx+1)+" non va ("+why+").", true);
    urlIdx++; tryUrl();
  };
  const guard=setTimeout(()=>fail("nessuna risposta"),15000);
  video.onplaying=()=>{
    if(my!==attempt) return;
    clearTimeout(guard); started=true; overlay("");
    $("liveBadge").hidden=false; status("In onda: "+ch.name);
    lastOk[ch.key]=url; store("lastOk",lastOk);
    if(bad[ch.key]){ delete bad[ch.key]; store("bad",bad); }
  };
  const start=()=>{ video.muted=false; video.play().catch(()=>{ video.muted=true; video.play().catch(()=>{}); status("Audio disattivato dal browser: tocca il video per attivarlo."); }); };
  if(window.Hls && Hls.isSupported()){
    hls=new Hls({manifestLoadingMaxRetry:2, levelLoadingMaxRetry:2});
    hls.on(Hls.Events.ERROR,(_,d)=>{ if(d.fatal){ clearTimeout(guard); fail(d.details||"errore video"); } });
    hls.on(Hls.Events.MANIFEST_PARSED, start);
    hls.loadSource(url); hls.attachMedia(video);
  }else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=url; video.onerror=()=>{ clearTimeout(guard); fail("errore video"); }; start();
  }else{
    clearTimeout(guard); overlay("Browser non compatibile","Questo browser non riesce a riprodurre i canali."); status("Il lettore video non si è caricato.", true);
  }
}

$("screen").addEventListener("click",()=>{ if(video.muted && current>=0){ video.muted=false; status("In onda: "+channels[current].name); } });
// Ordine dei canali per le frecce: preferiti (se attivo "Solo preferiti"), altrimenti i nazionali che funzionano
function sequence(){
  let seq = channels.map((c,i)=>i).filter(i=>channels[i].national && (!isBad(channels[i]) || i===current));
  if(onlyFav && favs.size) seq = channels.map((c,i)=>i).filter(i=>favs.has(channels[i].key));
  return seq;
}
function step(dir){
  if(!channels.length) return;
  const seq=sequence();
  if(current<0 || !seq.length){ play(seq.length?seq[0]:0); return; }
  const pos=seq.indexOf(current);
  if(pos<0){ play(current+dir); return; }
  play(seq[(pos+dir+seq.length)%seq.length]);
}
$("pPrev").onclick=()=>step(-1);
$("pNext").onclick=()=>step(1);
$("fsPrev").onclick=e=>{ e.stopPropagation(); step(-1); wake(); };
$("fsNext").onclick=e=>{ e.stopPropagation(); step(1); wake(); };

// A tutto schermo le frecce si nascondono dopo 4 secondi e ricompaiono toccando
let idleT=null;
function wake(){ const s=$("screen"); s.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>s.classList.add("idle"),4000); }
function fullChanged(){
  const f=document.fullscreenElement||document.webkitFullscreenElement;
  $("screen").classList.toggle("full", f===$("screen"));
  wake();
}
document.addEventListener("fullscreenchange",fullChanged); document.addEventListener("webkitfullscreenchange",fullChanged);
$("screen").addEventListener("pointermove",wake);

// Scritta con numero e nome del canale quando cambi
let toastT=null;
function toast(ch){
  $("toastNum").textContent = ch.num<999 ? ch.num : "";
  $("toastName").textContent = ch.name;
  const p = nowProg(ch); $("toastProg").textContent = p ? p[2] : "";
  $("toast").classList.remove("off"); clearTimeout(toastT);
  toastT=setTimeout(()=>$("toast").classList.add("off"),3500);
}
$("pFull").onclick=()=>{
  const s=$("screen");
  try{
    if(document.fullscreenElement && document.fullscreenElement===s) document.exitFullscreen();
    else if(document.fullscreenElement) document.exitFullscreen().then(()=>s.requestFullscreen()).catch(()=>{});
    else if(s.requestFullscreen) s.requestFullscreen().catch(()=>{});
    else if(video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  }catch(e){}
};
$("reload").onclick=load;
$("onlyFav").onclick=()=>{ onlyFav=!onlyFav; render(); };
$("showBad").onclick=()=>{ $("badList").hidden=!$("badList").hidden; render(); };
// Modalità TV: tutta la pagina a schermo intero (sparisce la barra del browser)
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement; }
$("tvMode").onclick=()=>{
  const d=document.documentElement;
  try{
    if(fsEl()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else{ const f=d.requestFullscreen||d.webkitRequestFullscreen; const r=f&&f.call(d); if(r&&r.catch) r.catch(()=>status("Il browser non permette lo schermo intero.",true)); }
  }catch(e){ status("Il browser non permette lo schermo intero.",true); }
};
function tvModeLabel(){ const on=!!fsEl(); $("tvMode").classList.toggle("on",on); $("tvMode").textContent= on?"✕ Esci da Modalità TV":"📺 Modalità TV"; }
document.addEventListener("fullscreenchange",tvModeLabel); document.addEventListener("webkitfullscreenchange",tvModeLabel);
$("showOther").onclick=()=>{ $("otherList").hidden=!$("otherList").hidden; render(); };

// Telecomando: freccia destra = canale successivo, freccia sinistra = precedente.
// Valgono anche i tasti ⏩ / ⏪ della Firestick e CH+ / CH-.
const NEXT_KEYS=["ArrowRight","Right","MediaFastForward","MediaTrackNext","ChannelUp","PageUp"];
const PREV_KEYS=["ArrowLeft","Left","MediaRewind","MediaTrackPrevious","ChannelDown","PageDown"];
document.addEventListener("keydown",e=>{
  const k=e.key, c=e.keyCode;
  const isNext = NEXT_KEYS.includes(k) || c===39 || c===228 || c===166;
  const isPrev = PREV_KEYS.includes(k) || c===37 || c===227 || c===167;
  const isPause = k==="MediaPlayPause" || c===179;
  if(!isNext && !isPrev && !isPause) return;
  wake();
  if(isPause){ e.preventDefault(); if(current>=0){ video.paused ? video.play().catch(()=>{}) : video.pause(); } return; }
  e.preventDefault();
  if(isNext) step(1); else step(-1);
});

try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
load();
</script>
