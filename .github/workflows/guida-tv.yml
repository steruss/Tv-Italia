name: Aggiorna guida TV

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore
  workflow_dispatch: {}       # pulsante "Run workflow" per lanciarlo a mano
  push:
    paths:
      - "tools/build_epg.py"
      - ".github/workflows/guida-tv.yml"

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crea epg.json
        run: python tools/build_epg.py
      - name: Salva se è cambiata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add epg.json
          git diff --cached --quiet || git commit -m "Guida TV aggiornata"
          git push
